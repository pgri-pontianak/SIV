```html
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">

  <!-- Responsif untuk HP, tablet, dan desktop -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <meta name="theme-color" content="#f4f6f9">

  <title>PGRI Pontianak</title>

  <!-- Logo tab -->
  <link rel="icon"
        type="image/png"
        href="https://github.com/pgri-pontianak.png">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      -webkit-text-size-adjust: 100%;
    }

    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #f4f6f9;
      font-family: Arial, sans-serif;
    }

    /* Wadah aplikasi memenuhi layar */
    .app-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background-color: #f4f6f9;
    }

    /* Tampilan aplikasi */
    .app-frame {
      position: absolute;
      top: 0;
      left: 0;
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      margin: 0;
      padding: 0;
      background-color: #f4f6f9;
    }

    /* HP: utamakan tinggi viewport yang stabil */
    @media screen and (max-width: 767px) {
      .app-container {
        height: 100vh;
        height: 100svh;
        height: 100dvh;
      }

      .app-frame {
        width: 100%;
        max-width: 100%;
      }
    }

    /* Tablet */
    @media screen and (min-width: 768px)
                       and (max-width: 1024px) {
      .app-container {
        height: 100vh;
        height: 100dvh;
      }

      .app-frame {
        width: 100%;
        height: 100%;
      }
    }

    /* Dukungan area aman pada perangkat berponi */
    @supports (padding: env(safe-area-inset-bottom)) {
      .app-container {
        padding-bottom: env(safe-area-inset-bottom);
      }
    }
  </style>
</head>

<body>
  <main class="app-container">
    <iframe
      class="app-frame"
      src="https://script.google.com/macros/s/AKfycbwkvR76nihmpnw9Zg9qKOLlpXlw0g68A8d4Ty3DepqsBSz8STWPbm3lYkyweNKAz3iT/exec"
      title="Aplikasi PGRI Pontianak"
      allowfullscreen
      loading="eager">
    </iframe>
  </main>
</body>
</html>
```
